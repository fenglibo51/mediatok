name: 自动构建并推送 Docker 镜像

on:
  push:
    branches: [main]
  release:
    types: [published]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 拉取代码
        uses: actions/checkout@v4

      - name: ⚙️ 配置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 📦 打包前端
        run: |
          npm install
          npm run build

      - name: 🔑 登录 Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 🐳 构建引擎
        uses: docker/setup-buildx-action@v3

      - name: 🚀 构建并推送
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/mediatok:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/mediatok:${{ github.event.release.tag_name || 'test' }}
